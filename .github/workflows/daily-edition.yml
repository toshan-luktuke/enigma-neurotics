name: Publish daily edition
on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Request Netlify rebuild
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$BUILD_HOOK" ]; then
            echo "Set the NETLIFY_BUILD_HOOK repository secret before enabling daily publishing."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --request POST --data '{}' "$BUILD_HOOK"
